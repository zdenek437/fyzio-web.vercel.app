<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Děkujeme za zprávu | Fyzioterapie Věra Kadeřávková</title>
  <meta name="description" content="Děkujeme za odeslání zprávy." />
  <style>
    :root{--bg:#f7f4ee;--white:rgba(255,255,255,.9);--text:#1f2937;--muted:#5b6470;--line:rgba(212,175,55,.22);--primary:#0f5f52;--primary-dark:#0a473d;--success:#0f5f52;--success-bg:#eef7f4;--shadow:0 26px 60px rgba(31,41,55,.12);--max:860px}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 0% 0%, rgba(245,236,208,.5), transparent 35%),radial-gradient(circle at 100% 0%, rgba(215,243,234,.6), transparent 32%),#f7f4ee;color:var(--text)}
    .card{width:min(var(--max), 100%);background:var(--white);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:34px;box-shadow:var(--shadow);padding:44px}
    .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--success-bg);color:var(--success);border:1px solid rgba(212,175,55,.24);font-weight:700;font-size:.95rem}
    h1{margin:18px 0 0;font-size:clamp(2rem, 5vw, 3.2rem);line-height:1.08;letter-spacing:-.03em}
    p{margin:18px 0 0;color:var(--muted);font-size:1.05rem;line-height:1.8;max-width:620px}
    .actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 22px;border-radius:999px;font-weight:700;text-decoration:none;transition:transform .2s ease, background .2s ease;border:1px solid transparent}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff}
    .btn-secondary{background:#fff;color:#334155;border-color:rgba(212,175,55,.28)}
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">✓ Zpráva byla odeslána</div>
    <h1>Děkujeme za vaši zprávu</h1>
    <p>Vaše poptávka byla úspěšně odeslána. Ozvu se vám co nejdříve zpět. Pokud potřebujete rychlou odpověď, můžete využít také telefonický kontakt.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Zpět na hlavní stránku</a>
      <a class="btn btn-secondary" href="tel:+420604927318">Zavolat nyní</a>
    </div>
  </main>
</body>
</html>
