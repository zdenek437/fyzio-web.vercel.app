<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Děkujeme za zprávu | Fyzioterapie Věra Kadeřávková</title>
  <meta name="description" content="Děkujeme za odeslání zprávy." />
  <style>
    :root{--bg:#f8fafc;--white:#ffffff;--text:#0f172a;--muted:#475569;--line:#e2e8f0;--primary:#059669;--primary-dark:#047857;--success:#065f46;--success-bg:#ecfdf5;--shadow:0 22px 50px rgba(15,23,42,.10);--max:860px}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 0% 0%, rgba(236,253,245,.95), transparent 35%),radial-gradient(circle at 100% 0%, rgba(224,242,254,.95), transparent 32%),#f8fafc;color:var(--text)}
    .card{width:min(var(--max), 100%);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);padding:42px}
    .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--success-bg);color:var(--success);border:1px solid #a7f3d0;font-weight:700;font-size:.95rem}
    h1{margin:18px 0 0;font-size:clamp(2rem, 5vw, 3.2rem);line-height:1.08;letter-spacing:-.03em}
    p{margin:18px 0 0;color:var(--muted);font-size:1.05rem;line-height:1.8;max-width:620px}
    .actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 22px;border-radius:18px;font-weight:700;text-decoration:none;transition:transform .2s ease, background .2s ease;border:1px solid transparent}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-dark)}
    .btn-secondary{background:#fff;color:#334155;border-color:#cbd5e1}
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">✓ Zpráva byla odeslána</div>
    <h1>Děkujeme za vaši zprávu</h1>
    <p>Vaše poptávka byla úspěšně odeslána. Ozvu se vám co nejdříve zpět. Pokud potřebujete rychlou odpověď, můžete využít také telefonický kontakt.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Zpět na hlavní stránku</a>
      <a class="btn btn-secondary" href="tel:+420604927318">Zavolat nyní</a>
    </div>
  </main>
</body>
</html>
